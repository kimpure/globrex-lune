name = "kimpure/globrex_lune"
version = "0.1.1"
description = "glob to regular expression compiler."
authors = ["sunwoo"]
repository = "https://github.com/kimpure/globrex-lune"
license = "MIT"
includes = ["src", "README.md", "LICENSE.md", "pesde.toml"]

[target]
environment = "lune"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/daimond113/pesde-index"

[dependencies]
luau_regexp = { name = "jiwonz/luau_regexp", version = "^0.1.0", target = "luau" }
